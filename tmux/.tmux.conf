# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
# true colour, undercurl, hyperlinks and synchronized output in Ghostty
set -as terminal-features ",xterm-ghostty:RGB:usstyle:hyperlinks:sync"
set -as terminal-features ",xterm-256color:RGB:usstyle"

set -g history-limit 50000
set -g mouse on
set -sg escape-time 0       # no delay after Esc (nvim)
set -g focus-events on      # nvim reloads changed files when the pane gets focus
set -g set-clipboard on     # copy through to the system clipboard (OSC 52)
set -g allow-passthrough on # let programs talk to the terminal (images, notifications)
setw -g mode-keys vi

# reload configuration
bind r source-file ~/.tmux.conf \; display "~/.tmux.conf sourced"

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows
setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed
set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time
set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.1' \; clear-history

# -- prefix --------------------------------------------------------------------
# remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# splits and new windows open in the current pane's directory
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind h
unbind n
unbind e
unbind i

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

# the pane you move to takes 70% of the window, the others share the rest
# (not while a pane is zoomed; prefix + = toggles it for the session)
set -g @focus_resize on
set-hook -g after-select-pane "if -F '#{&&:#{==:#{@focus_resize},on},#{!=:#{window_zoomed_flag},1}}' 'resize-pane -x 70% -y 70%'"
set-hook -g after-split-window "if -F '#{==:#{@focus_resize},on}' 'resize-pane -x 70% -y 70%'"
bind = if -F '#{==:#{@focus_resize},on}' "set @focus_resize off ; select-layout -E ; display 'focus resize off'" "set @focus_resize on ; display 'focus resize on'"

# copy mode: v selects, y copies
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- theme: Aura Soft Dark (same palette as Ghostty and nvim) --------------------
# No plugins. The bar is transparent, so it sits on the terminal background.

set -g @purple "#a277ff"
set -g @green  "#61ffca"
set -g @orange "#ffca85"
set -g @pink   "#f694ff"
set -g @red    "#ff6767"
set -g @fg     "#edecee"
set -g @dim    "#b4b2c0"
set -g @gray   "#6d6d6d"
set -g @line   "#34324a"
set -g @sel    "#3d375e"

# two rows at the top: the bar, then a thin rule under it
set -g status-position top
set -g status 2
set -g status-style "bg=default,fg=#b4b2c0"
set -g status-justify left
set -g status-format[1] "#[fg=#{@line}]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"

# left: session name, orange while the prefix is pressed
set -g status-left-length 40
set -g status-left-style default
set -g status-left "#[fg=#{?client_prefix,#{@orange},#{@purple}},bold]   #S  "

# windows: number and name, the current one bright; then the mark of the agent
# in it (@home_mark, see the end of this file)
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@gray}] #I #[fg=#{?window_bell_flag,#{@red},#{?window_activity_flag,#{@orange},#{@gray}}}]#W#{E:@home_mark} "
set -g window-status-current-format "#[fg=#{@purple},bold] #I #[fg=#{@fg}]#W#{?window_zoomed_flag, #[fg=#{@pink}]⤢,}#{E:@home_mark} "
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default

# right: agents asking for input in other sessions, folder of the active pane, clock
set -g status-right-length 110
set -g status-right-style default
set -g status-right "#{E:@home_waiting}#[fg=#{@gray}]#{=/-45/…;s|^$HOME|~|:pane_current_path}  #[fg=#{@dim}]%H:%M  "

# panes, messages, selection, menus
set -g pane-border-lines single
set -g pane-border-style "fg=#34324a"
set -g pane-active-border-style "fg=#a277ff"
set -g message-style "bg=default,fg=#ffca85"
set -g message-command-style "bg=default,fg=#ffca85"
set -g mode-style "bg=#3d375e,fg=#edecee"
set -g copy-mode-match-style "bg=#3d375e,fg=#edecee"
set -g copy-mode-current-match-style "bg=#ffca85,fg=#21202e"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#34324a"
set -g menu-style "bg=default,fg=#b4b2c0"
set -g menu-selected-style "bg=#3d375e,fg=#edecee"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#34324a"
set -g display-panes-colour "#6d6d6d"
set -g display-panes-active-colour "#a277ff"
set -g clock-mode-colour "#a277ff"

# -- home ------------------------------------------------------------------------
# Agent marks on the window names, the picker on prefix + Space and
# prefix + a to go to a waiting agent (dotfiles/home). Keep this last.
source-file -q ~/.config/home/tmux.conf
