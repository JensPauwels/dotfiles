# home: agent marks on the window names, and the picker. Sourced at the end
# of ~/.tmux.conf.
#
# Claude Code and Codex run `home agent STATE` from their hooks, which sets
# the window option @home_agent. The window formats in .tmux.conf end in
# #{E:@home_mark} to draw it after the name:
#   ● orange  the agent asks for your input
#   ✓ green   it finished while you were elsewhere
#   ◐ purple  it is working
set -g @home_mark "#{?#{==:#{@home_agent},waiting},#[fg=#ffca85] ●,#{?#{==:#{@home_agent},done},#[fg=#61ffca] ✓,#{?#{==:#{@home_agent},working},#[fg=#a277ff] ◐,}}}"

# For the right of the status line: the windows in other sessions where an
# agent asks for input, as session:window. Empty when there are none.
set -g @home_waiting "#{S:#{W:#{?#{&&:#{==:#{@home_agent},waiting},#{!=:#{session_name},#{client_session}}},#[fg=#ffca85]● #{session_name}:#{window_index}  ,}}}"

# "finished" has been seen once you go to the window
set-hook -g session-window-changed[90] "if -F '#{==:#{@home_agent},done}' 'set -wu @home_agent'"
set-hook -g client-session-changed[90] "if -F '#{==:#{@home_agent},done}' 'set -wu @home_agent'"

# prefix + Space: the picker (actions and port forwards); what you pick opens
# in a new window of this session
bind Space display-popup -E -w 80% -h 70% -T " home " -d "#{pane_current_path}" home
# prefix + a: to the next window where an agent waits for you
bind a run-shell 'home next "#{client_name}"'
